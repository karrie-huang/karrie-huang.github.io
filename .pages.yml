# ---------------------------------------------------------------------------
# Pages CMS — the editing forms at https://app.pagescms.org
#
# This file tells Pages CMS what the words files look like, so it can show
# them as labelled forms instead of raw text. Each entry below is one section
# in the sidebar; each field is one box in the form. The "description" lines
# appear under the box as help text.
#
# The site's build checks the same shape (src/content.config.ts). If you add a
# field, add it in both places.
# ---------------------------------------------------------------------------
content:
  # ---- Site: name, headline, standfirst, contact --------------------------
  - name: site
    label: Site
    description: Your name, the homepage headline and standfirst, and the LinkedIn link.
    type: file
    path: src/content/site.yaml
    fields:
      - name: name
        label: Your name
        type: string
        required: true
        description: Top-left of every page, in the footer, and in the browser tab.
      - name: headline
        label: Headline
        type: string
        required: true
        options: { maxlength: 60 }
        description: >-
          The largest text on the site. Keep it around fifty characters — any
          longer and Quotidian's links drop off the first screen on a phone.
          Check the homepage on your phone after changing it.
      - name: standfirst
        label: Standfirst
        type: text
        required: true
        description: >-
          The paragraph beside the headline. "Final year" is the one phrase
          here that goes stale: change it when you graduate.
      - name: description
        label: Search and link-preview description
        type: text
        required: true
        description: >-
          Shown under the page title by Google, and when the link is pasted into
          LinkedIn or a chat. Two short sentences.
      - name: hideFromSearch
        label: Keep the site out of search results
        type: boolean
        description: >-
          Leave this off and the site can appear in Google. Tick it and search
          engines are told not to list it, while every link keeps working
          exactly as before, so anything you paste into an application still
          opens fine. Off is the normal choice for a portfolio, because a
          recruiter who looks you up finding this site is usually a good thing.
      - name: linkedin
        label: LinkedIn address
        type: string
        required: true
        pattern:
          regex: "^https://"
          message: "Must start with https://"
        description: The only contact route on the site. There is deliberately no email address.

  # ---- About -----------------------------------------------------------------
  - name: about
    label: About
    description: Biography, experience, everything else, education.
    type: file
    path: src/content/about.yaml
    fields:
      - name: bio
        label: Biography
        type: text
        list: true
        required: true
        description: One paragraph per entry, in the first person. The first paragraph is the one most people read.
      - name: experience
        label: Experience
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{role}, {org} — {period}"
        description: Jobs, newest first. Use "Add" for a new one and drag to reorder.
        fields:
          - name: role
            label: Role
            type: string
            required: true
          - name: org
            label: Organisation
            type: string
            required: true
          - name: period
            label: Period
            type: string
            required: true
            description: 'Free text: "Summer 2026", "2025", "2024–25".'
          - name: note
            label: One-line note
            type: string
            description: What you actually did there, in one sentence. Optional.
      - name: elsewhere
        label: Elsewhere
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{role}, {org}"
        description: >-
          Things outside work that a CV would not tell a reader. Put the
          interesting word in "Role" — it is set in bold. Two or three entries,
          not a list of everything.
        fields:
          - name: role
            label: Role
            type: string
            required: true
          - name: org
            label: Organisation or place
            type: string
            required: true
          - name: period
            label: Period
            type: string
            description: Optional. Only for something finished, e.g. "before Oxford".
      - name: education
        label: Education
        type: object
        fields:
          - name: degree
            label: Degree
            type: string
            required: true
          - name: school
            label: University
            type: string
            required: true
          - name: detail
            label: Detail line
            type: string
            required: true
            description: >-
              Shown under the degree. Has a shelf life — "Final year" and
              "Expected 2027" both stop being true in summer 2027.

  # ---- Work: the catalogue of lots ------------------------------------------
  - name: work
    label: Work
    description: Every piece of work, as numbered lots. The first is the lead.
    type: file
    path: src/content/work.yaml
    fields:
      - name: lots
        label: Lots
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {org}, {year}"
        description: >-
          Drag to reorder; the order is the same on the homepage and the Work
          page. Tick "Lead" on any lot to show it at the biggest title size —
          one, two, or more. If nothing is ticked, the first lot is the lead.
          The heavy rule always sits above whichever lot is first.
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: org
            label: Organisation
            type: string
            description: >-
              Who the work was for. Use "Personal" for your own projects.
              Optional: leave it blank to keep it off the page.
          - name: year
            label: Year
            type: string
            description: >-
              Optional. Shown beside the organisation under the title, unless a
              tagline replaces both.
          - name: lead
            label: Lead
            type: boolean
            description: >-
              Tick to show this lot at the biggest title size. Tick as many as
              you like; if none is ticked, the first lot is the lead.
          - name: tagline
            label: Tagline
            type: string
            description: >-
              The italic line under the title. Any lot can have one. Fill it in
              and it replaces the "Organisation, year" line; leave it blank and
              that line shows instead.
          - name: blurb
            label: Blurb
            type: text
            description: One short paragraph. Shown on the Work page only — the homepage lots are deliberately shorter.
          - name: fields
            label: Catalogue fields
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{label}: {value}"
            description: >-
              The labelled facts beside the lot. Provenance, Condition, Scope,
              Literature. Two or three per lot. A field with a link becomes a
              link. This is the honest place for "Unannounced", stated as a fact
              rather than an apology.
            fields:
              - name: label
                label: Label
                type: string
                required: true
                description: One word, e.g. Provenance, Condition, Scope, Literature.
              - name: value
                label: Value
                type: string
                required: true
              - name: href
                label: Link
                type: string
                description: Optional. A full web address starting with https://
          - name: caseStudy
            label: Case study
            type: reference
            options:
              collection: case-studies
              value: "{name}"
              label: "{primary}"
            description: >-
              Optional. Pick a case study and the lot gets a "Read the case
              study" link. Write the case study first (Case studies, in the
              sidebar), then come back here and pick it.
          - name: link
            label: Outside link
            type: object
            description: >-
              Optional, and only used if there is no case study. E.g. "Try it"
              pointing at a live product.
            fields:
              - name: label
                label: Link text
                type: string
              - name: href
                label: Web address
                type: string
                description: Starts with https://
      - name: earlier
        label: Earlier work
        type: object
        description: >-
          One quiet line at the foot of the Work page, for work that belongs on
          the record but not level with the lots above.
        fields:
          - name: label
            label: Label
            type: string
            required: true
            description: One word, e.g. Journalism.
          - name: note
            label: Note
            type: text
            required: true
          - name: linkLabel
            label: Link text
            type: string
            required: true
          - name: href
            label: Web address
            type: string
            required: true

  # ---- Case studies: one file per page under /work/ -------------------------
  - name: case-studies
    label: Case studies
    description: The long write-ups. Each one is a page at /work/<its-name>.
    type: collection
    path: src/content/case-studies
    format: yaml
    filename: "{primary}.yaml"
    view:
      primary: title
      fields: [title, org, period]
      sort: [title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: >-
          Also becomes the web address when you create one — "Something new"
          becomes /work/something-new. Match the lot title on the Work page.
      - name: org
        label: Organisation
        type: string
        description: >-
          Who the work was for. Optional: leave it blank and the row disappears
          from the facts column beside the story.
      - name: role
        label: Your role
        type: string
        description: Optional. Leave it blank and the row disappears.
      - name: period
        label: Period
        type: string
        description: >-
          E.g. "Summer 2026" or "2025". Optional. Leave it blank and the row
          disappears.
      - name: fields
        label: Catalogue fields
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{label}: {value}"
        description: >-
          The labelled facts in the column beside the story, under Period.
          Question, Basis, Method, Condition, Scope. Two or three is right. A
          field with a link becomes a link.
        fields:
          - name: label
            label: Label
            type: string
            required: true
            description: One word, e.g. Question, Basis, Method, Condition.
          - name: value
            label: Value
            type: string
            required: true
          - name: href
            label: Link
            type: string
            description: Optional. A full web address starting with https://
      - name: standfirst
        label: Standfirst
        type: text
        required: true
        description: >-
          The one paragraph a skimming reader is guaranteed to read. It does
          the job of an abstract, and is set larger than the body.
      - name: note
        label: Framing note
        type: text
        description: >-
          Optional. Anything a reader has to know BEFORE the story rather than
          after it — e.g. "this is 2025 work and some of it is out of date".
          Set apart with a rule, quieter than the body.
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        required: true
        description: The story, in three to five sections. Each has a heading and one or more paragraphs.
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: paras
            label: Paragraphs
            type: text
            list: true
            required: true
            description: One paragraph per entry.
      - name: evidence
        label: Evidence
        type: object
        description: >-
          The one thing on the page a reader can check independently — a
          launch post, a listing, a press mention. Shows in the facts column
          and travels with the reader. Leave both empty while there is nothing
          public to point at, and nothing renders.
        fields:
          - name: label
            label: Link text
            type: string
            description: E.g. "Reid Hoffman on the launch".
          - name: href
            label: Web address
            type: string
            description: Starts with https://
