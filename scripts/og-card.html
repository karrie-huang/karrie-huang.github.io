<!doctype html><html><head><meta charset="utf-8">
<!-- Source for public/og.png, the social share card.
     Exactly 1200x630 - the size every unfurler expects.
     Deliberately PERMANENT: it carries only the name, the headline and the
     address. The headline was chosen to stay true for years, and the lot line
     that used to sit in the foot was removed because the lead lot can change.
     It should not need regenerating; if the headline ever does change, the
     recipe is in scripts/make-og.mjs.

     Deliberately built from the site's own colours and faces so the card and
     the page read as one object. The values below are copies of the tokens in
     src/styles/global.css: this file is opened directly in a browser, outside
     the build, so it cannot import them. If the palette changes there, change
     it here too.

     NOTE: .headline margin-top is tuned to the CURRENT headline. At three lines
     the descender of a "p" or "g" on the last line collides with the 2px foot
     rule at the old 56px. If SITE.headline changes length, re-render and LOOK
     at the result before shipping it. -->
<style>
  @font-face{font-family:'SP';src:url('../node_modules/@fontsource/spectral/files/spectral-latin-400-normal.woff2') format('woff2');font-weight:400;font-style:normal;font-display:block}
  @font-face{font-family:'SP';src:url('../node_modules/@fontsource/spectral/files/spectral-latin-600-normal.woff2') format('woff2');font-weight:600;font-style:normal;font-display:block}
  @font-face{font-family:'SP';src:url('../node_modules/@fontsource/spectral/files/spectral-latin-400-italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:block}
  @font-face{font-family:'AR';src:url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    background:#ffffff;color:#152150;
    font-family:'SP',Georgia,serif;font-variant-numeric:oldstyle-nums;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:76px 92px;
  }
  .name{font-size:34px;font-weight:600;letter-spacing:0.055em;text-transform:uppercase}
  .hairline{height:1px;background:#e2e5ee;margin-top:26px}
  .headline{font-size:92px;font-weight:400;line-height:0.98;letter-spacing:-0.028em;margin-top:34px;max-width:13ch}
  .foot{display:flex;justify-content:flex-end;align-items:baseline;border-top:2px solid #152150;padding-top:22px}
  .url{font-family:'AR',system-ui,sans-serif;font-size:19px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#555f80}
</style></head>
<body>
  <div>
    <div class="name">Karrie Huang</div>
    <div class="hairline"></div>
    <div class="headline">Independent, curious, and smart, I hope.</div>
  </div>
  <div class="foot">
    <span class="url">karrie-huang.github.io</span>
  </div>
</body></html>
